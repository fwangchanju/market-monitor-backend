# Loaded for this repository only when Codex trusts the project.
approval_policy = "on-request"
default_permissions = "market-monitor"

[permissions.market-monitor]
description = "Edit the workspace while denying reads of environment files"
extends = ":workspace"

[permissions.market-monitor.filesystem]
glob_scan_max_depth = 6

[permissions.market-monitor.filesystem.":workspace_roots"]
"**/*.env" = "deny"
"**/*.env.*" = "deny"
