name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # DB·외부 API 없이 돌아야 한다 — 매뉴얼 테스트(@Tag("manual"))는 build.gradle의 test 태스크에서
      # 이미 제외된다(1B-1).
      - name: spotlessCheck / compileJava / compileTestJava / test
        run: ./gradlew spotlessCheck compileJava compileTestJava test
