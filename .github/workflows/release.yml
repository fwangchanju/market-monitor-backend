name: Release

on:
  push:
    branches:
      - 'release/**'
  repository_dispatch:
    types: [frontend-assets-published]
  workflow_dispatch:
    inputs:
      target:
        description: '빌드 대상'
        required: true
        default: 'application'
        type: choice
        options:
          - application
          - nginx
          - renderer
          - all

jobs:
  changes:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: read
    outputs:
      application: ${{ steps.filter.outputs.application }}
      nginx: ${{ steps.filter.outputs.nginx }}
      renderer: ${{ steps.filter.outputs.renderer }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            application:
              - 'Dockerfile'
              - 'src/main/**'
              - 'build.gradle'
              - 'settings.gradle'
              - 'gradle.properties'
              - 'gradlew'
              - 'gradle/**'
            nginx:
              - 'containers/nginx/**'
              - 'infra/nginx.conf'
            renderer:
              - 'containers/renderer/**'

  application:
    needs: [changes]
    if: |
      always() &&
      ((github.event_name == 'workflow_dispatch' && (inputs.target == 'application' || inputs.target == 'all')) ||
       (github.event_name == 'push' && needs.changes.outputs.application == 'true'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push application image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ghcr.io/fwangchanju/market-monitor:latest
          cache-from: type=gha,scope=application
          cache-to: type=gha,mode=max,scope=application

      - name: Deploy to server 1 (application)
        uses: appleboy/ssh-action@v1
        env:
          CR_PAT: ${{ secrets.CR_PAT }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: CR_PAT
          script: |
            source ~/repo/market-monitor-backend/infra/scripts/env.sh
            git -C "$REPO_DIR" fetch origin main
            git -C "$REPO_DIR" reset --hard origin/main
            bash "$REPO_DIR/infra/scripts/deploy-application.sh"

  nginx:
    needs: [changes]
    if: |
      always() &&
      ((github.event_name == 'workflow_dispatch' && (inputs.target == 'nginx' || inputs.target == 'all')) ||
       github.event_name == 'repository_dispatch' ||
       (github.event_name == 'push' && needs.changes.outputs.nginx == 'true'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push nginx image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: containers/nginx/Dockerfile
          push: true
          tags: ghcr.io/fwangchanju/market-monitor-nginx:latest
          cache-from: type=gha,scope=nginx
          cache-to: type=gha,mode=max,scope=nginx

      - name: Deploy to server 1 (nginx)
        uses: appleboy/ssh-action@v1
        env:
          CR_PAT: ${{ secrets.CR_PAT }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: CR_PAT
          script: |
            source ~/repo/market-monitor-backend/infra/scripts/env.sh
            git -C "$REPO_DIR" fetch origin main
            git -C "$REPO_DIR" reset --hard origin/main
            bash "$REPO_DIR/infra/scripts/deploy-nginx.sh"

  renderer:
    needs: [changes]
    if: |
      always() &&
      ((github.event_name == 'workflow_dispatch' && (inputs.target == 'renderer' || inputs.target == 'all')) ||
       (github.event_name == 'push' && needs.changes.outputs.renderer == 'true'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push renderer image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: containers/renderer/Dockerfile
          push: true
          tags: ghcr.io/fwangchanju/market-monitor-renderer:latest
          cache-from: type=gha,scope=renderer
          cache-to: type=gha,mode=max,scope=renderer

      - name: Deploy to server 2 (renderer)
        uses: appleboy/ssh-action@v1
        env:
          CR_PAT: ${{ secrets.CR_PAT }}
        with:
          host: ${{ secrets.RENDERER_SERVER_HOST }}
          username: ${{ secrets.RENDERER_SERVER_USER }}
          key: ${{ secrets.RENDERER_SERVER_SSH_KEY }}
          envs: CR_PAT
          script: |
            source ~/repo/market-monitor-backend/infra/scripts/env.sh
            git -C "$REPO_DIR" fetch origin main
            git -C "$REPO_DIR" reset --hard origin/main
            bash "$REPO_DIR/infra/scripts/deploy-renderer.sh"
