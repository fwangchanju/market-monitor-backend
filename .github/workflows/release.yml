name: Release

on:
  push:
    branches:
      - '**'
  repository_dispatch:
    types: [frontend-assets-published]
  workflow_dispatch:
    inputs:
      target:
        description: '수동 배포 대상. "Use workflow from"에서 고른 브랜치 기준으로 동작 — 그 브랜치 태그 이미지가 이미 있으면 재사용, 없으면 빌드 후 배포한다.'
        required: true
        default: 'application'
        type: choice
        options:
          - application
          - nginx
          - renderer
          - all

jobs:
  changes:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: read
    outputs:
      application: ${{ steps.filter.outputs.application }}
      application_scripts: ${{ steps.filter.outputs.application_scripts }}
      nginx: ${{ steps.filter.outputs.nginx }}
      renderer: ${{ steps.filter.outputs.renderer }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            application:
              - 'Dockerfile'
              - 'src/main/**'
              - 'build.gradle'
              - 'settings.gradle'
              - 'gradle.properties'
              - 'gradlew'
              - 'gradle/**'
            application_scripts:
              - 'infra/scripts/deploy-application.sh'
              - 'infra/scripts/health-check.sh'
              - 'infra/scripts/env.sh'
              - 'infra/docker-compose.yml'
              - '.github/workflows/release.yml'
            nginx:
              - 'containers/nginx/**'
              - 'infra/nginx.conf'
              - 'infra/nginx-docker-compose.yml'
              - 'infra/scripts/deploy-nginx.sh'
              - 'infra/scripts/nginx-health-check.sh'
            renderer:
              - 'containers/renderer/**'
              - 'infra/renderer-docker-compose.yml'
              - 'infra/scripts/deploy-renderer.sh'

  # 브랜치(main 제외) push: application 관련 변경이 있으면 빌드해서 sha/브랜치 태그로만 푸시. 배포는 안 함.
  build:
    needs: [changes]
    if: |
      always() &&
      github.event_name == 'push' &&
      github.ref != 'refs/heads/main' &&
      needs.changes.outputs.application == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image tags
        id: tag
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          echo "sha_tag=sha-${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "branch_tag=branch-$(echo "$REF_NAME" | tr '/' '-')" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push application image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/fwangchanju/market-monitor:${{ steps.tag.outputs.sha_tag }}
            ghcr.io/fwangchanju/market-monitor:${{ steps.tag.outputs.branch_tag }}
          cache-from: type=gha,scope=application
          cache-to: type=gha,mode=max,scope=application

  # main push(항상 머지 커밋): 재빌드 없이, 머지된 브랜치(HEAD^2)용으로 이미 빌드된 이미지를 :main으로 승격시키고 배포.
  # application(코드) 변경 시: 이미지 존재 확인(빌드 대기)→승격→배포→헬스체크→정리 전부 수행.
  # application_scripts(배포/헬스체크 스크립트)만 변경 시: 재빌드 대상이 없으므로 승격/정리는 건너뛰고
  # 재빌드 없이 이미 있는 :main 이미지를 그대로 재배포 + 새 스크립트로 헬스체크만 수행.
  promote-main:
    needs: [changes]
    if: |
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      (needs.changes.outputs.application == 'true' || needs.changes.outputs.application_scripts == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve merged branch commit
        if: needs.changes.outputs.application == 'true'
        id: resolve
        run: |
          MERGED_SHA=$(git rev-parse HEAD^2 2>/dev/null || echo "")
          echo "merged_sha=$MERGED_SHA" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: needs.changes.outputs.application == 'true' && steps.resolve.outputs.merged_sha != ''
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check image exists for merged commit (build job이 아직 안 끝났으면 완료까지 대기)
        if: needs.changes.outputs.application == 'true' && steps.resolve.outputs.merged_sha != ''
        id: check
        run: |
          TIMEOUT=600
          INTERVAL=10
          elapsed=0
          while [ "$elapsed" -lt "$TIMEOUT" ]; do
            if docker manifest inspect "ghcr.io/fwangchanju/market-monitor:sha-${{ steps.resolve.outputs.merged_sha }}" > /dev/null 2>&1; then
              echo "exists=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep "$INTERVAL"
            elapsed=$((elapsed + INTERVAL))
          done
          echo "exists=false" >> "$GITHUB_OUTPUT"

      - name: Promote image to :main (재빌드 없이 레지스트리에서 재태깅)
        if: steps.check.outputs.exists == 'true'
        run: |
          docker buildx imagetools create \
            -t ghcr.io/fwangchanju/market-monitor:main \
            ghcr.io/fwangchanju/market-monitor:sha-${{ steps.resolve.outputs.merged_sha }}

      - name: Deploy to server 1 (application)
        if: steps.check.outputs.exists == 'true' || (needs.changes.outputs.application != 'true' && needs.changes.outputs.application_scripts == 'true')
        uses: appleboy/ssh-action@v1
        env:
          CR_PAT: ${{ secrets.CR_PAT }}
          IMAGE_TAG: main
          GIT_REF: ${{ github.ref_name }}
          # promote-main은 항상 push-to-main에서만 도니 GIT_REF는 여기서 늘 "main"이다.
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: CR_PAT,IMAGE_TAG,GIT_REF
          script: |
            source ~/repo/market-monitor-backend/infra/scripts/env.sh
            git -C "$REPO_DIR" fetch origin "$GIT_REF"
            git -C "$REPO_DIR" reset --hard "origin/$GIT_REF"
            bash "$REPO_DIR/infra/scripts/deploy-application.sh"

      - name: Health check
        if: steps.check.outputs.exists == 'true' || (needs.changes.outputs.application != 'true' && needs.changes.outputs.application_scripts == 'true')
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            bash "$HOME/repo/market-monitor-backend/infra/scripts/health-check.sh"

      - name: Clean up old GHCR package versions (최근 5개만 유지)
        if: steps.check.outputs.exists == 'true'
        uses: actions/delete-package-versions@v5
        with:
          package-name: 'market-monitor'
          package-type: 'container'
          min-versions-to-keep: 5
          token: ${{ secrets.CR_PAT }}

  # 수동 배포 (target=application 또는 all). "Use workflow from"으로 고른 브랜치 기준으로 동작 —
  # main이면 :main 태그(자동 배포와 동일, 영향 없음), 그 외 브랜치면 :branch-<이름> 태그를 쓴다.
  # 그 태그 이미지가 이미 있으면(브랜치 push 시 build job이 이미 만들어둔 경우가 보통) 재빌드 없이 바로
  # 배포하고, 없을 때만 새로 빌드한다 — 트라이얼/롤백이 빠르면서도 브랜치를 시험 배포해도 :main 태그는
  # 안 건드린다.
  application:
    if: github.event_name == 'workflow_dispatch' && (inputs.target == 'application' || inputs.target == 'all')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image tag
        id: tag
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_NAME" = "main" ]; then
            echo "image_tag=main" >> "$GITHUB_OUTPUT"
          else
            echo "image_tag=branch-$(echo "$REF_NAME" | tr '/' '-')" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if image already exists
        id: check
        run: |
          if docker manifest inspect "ghcr.io/fwangchanju/market-monitor:${{ steps.tag.outputs.image_tag }}" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.check.outputs.exists == 'false'
        uses: docker/setup-buildx-action@v3

      - name: Build and push application image
        if: steps.check.outputs.exists == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ghcr.io/fwangchanju/market-monitor:${{ steps.tag.outputs.image_tag }}
          cache-from: type=gha,scope=application
          cache-to: type=gha,mode=max,scope=application

      - name: Deploy to server 1 (application)
        uses: appleboy/ssh-action@v1
        env:
          CR_PAT: ${{ secrets.CR_PAT }}
          IMAGE_TAG: ${{ steps.tag.outputs.image_tag }}
          GIT_REF: ${{ github.ref_name }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: CR_PAT,IMAGE_TAG,GIT_REF
          script: |
            source ~/repo/market-monitor-backend/infra/scripts/env.sh
            git -C "$REPO_DIR" fetch origin "$GIT_REF"
            git -C "$REPO_DIR" reset --hard "origin/$GIT_REF"
            bash "$REPO_DIR/infra/scripts/deploy-application.sh"

      - name: Health check
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            bash "$HOME/repo/market-monitor-backend/infra/scripts/health-check.sh"

  nginx:
    needs: [changes]
    if: |
      always() &&
      ((github.event_name == 'workflow_dispatch' && (inputs.target == 'nginx' || inputs.target == 'all')) ||
       github.event_name == 'repository_dispatch' ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.nginx == 'true'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image tag
        id: tag
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_NAME" = "main" ]; then
            echo "image_tag=latest" >> "$GITHUB_OUTPUT"
          else
            echo "image_tag=branch-$(echo "$REF_NAME" | tr '/' '-')" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push nginx image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: containers/nginx/Dockerfile
          push: true
          tags: ghcr.io/fwangchanju/market-monitor-nginx:${{ steps.tag.outputs.image_tag }}
          cache-from: type=gha,scope=nginx
          cache-to: type=gha,mode=max,scope=nginx

      - name: Deploy to server 1 (nginx)
        uses: appleboy/ssh-action@v1
        env:
          CR_PAT: ${{ secrets.CR_PAT }}
          IMAGE_TAG: ${{ steps.tag.outputs.image_tag }}
          GIT_REF: ${{ github.ref_name }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: CR_PAT,IMAGE_TAG,GIT_REF
          script: |
            source ~/repo/market-monitor-backend/infra/scripts/env.sh
            git -C "$REPO_DIR" fetch origin "$GIT_REF"
            git -C "$REPO_DIR" reset --hard "origin/$GIT_REF"
            bash "$REPO_DIR/infra/scripts/deploy-nginx.sh"

      - name: Health check
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            bash "$HOME/repo/market-monitor-backend/infra/scripts/nginx-health-check.sh"

  renderer:
    needs: [changes]
    if: |
      always() &&
      ((github.event_name == 'workflow_dispatch' && (inputs.target == 'renderer' || inputs.target == 'all')) ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.renderer == 'true'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image tag
        id: tag
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_NAME" = "main" ]; then
            echo "image_tag=latest" >> "$GITHUB_OUTPUT"
          else
            echo "image_tag=branch-$(echo "$REF_NAME" | tr '/' '-')" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if image already exists
        id: check
        run: |
          if docker manifest inspect "ghcr.io/fwangchanju/market-monitor-renderer:${{ steps.tag.outputs.image_tag }}" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.check.outputs.exists == 'false'
        uses: docker/setup-buildx-action@v3

      - name: Build and push renderer image
        if: steps.check.outputs.exists == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: containers/renderer/Dockerfile
          push: true
          tags: ghcr.io/fwangchanju/market-monitor-renderer:${{ steps.tag.outputs.image_tag }}
          cache-from: type=gha,scope=renderer
          cache-to: type=gha,mode=max,scope=renderer

      - name: Deploy to server 2 (renderer)
        uses: appleboy/ssh-action@v1
        env:
          CR_PAT: ${{ secrets.CR_PAT }}
          IMAGE_TAG: ${{ steps.tag.outputs.image_tag }}
          GIT_REF: ${{ github.ref_name }}
        with:
          host: ${{ secrets.RENDERER_SERVER_HOST }}
          username: ${{ secrets.RENDERER_SERVER_USER }}
          key: ${{ secrets.RENDERER_SERVER_SSH_KEY }}
          envs: CR_PAT,IMAGE_TAG,GIT_REF
          script: |
            source ~/repo/market-monitor-backend/infra/scripts/env.sh
            git -C "$REPO_DIR" fetch origin "$GIT_REF"
            git -C "$REPO_DIR" reset --hard "origin/$GIT_REF"
            bash "$REPO_DIR/infra/scripts/deploy-renderer.sh"
