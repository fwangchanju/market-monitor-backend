services:
  market-monitor-nginx:
    image: ghcr.io/fwangchanju/market-monitor-nginx:latest
    container_name: market-monitor-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /home/deploy/app/market-monitor-backend/infra/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /etc/nginx/.htpasswd:/etc/nginx/.htpasswd:ro
    networks:
      - proxy

networks:
  proxy:
    external: true
