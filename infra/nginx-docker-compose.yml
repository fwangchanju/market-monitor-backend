services:
  market-monitor-nginx:
    image: ghcr.io/fwangchanju/market-monitor-nginx:${IMAGE_TAG}
    container_name: market-monitor-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /etc/nginx/.htpasswd:/etc/nginx/.htpasswd:ro
      - ${HOME}/certbot-webroot:/var/www/certbot:ro
    networks:
      - proxy

networks:
  proxy:
    external: true
