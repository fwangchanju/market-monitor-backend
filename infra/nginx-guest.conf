limit_req_zone  $binary_remote_addr  zone=general:10m  rate=20r/s;
limit_req_zone  $binary_remote_addr  zone=auth:10m     rate=10r/m;
limit_conn_zone $binary_remote_addr  zone=conn:10m;

limit_req_status  429;
limit_conn_status 429;

server {
    listen 80;
    server_name eolmae.duckdns.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name eolmae.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/eolmae.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eolmae.duckdns.org/privkey.pem;

    location = /internal/access-check-admin {
        internal;
        proxy_pass http://market-monitor:8081/internal/access-check/admin;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /internal/register-ip {
        limit_req  zone=general burst=50 nodelay;
        limit_conn conn 100;
        proxy_pass http://market-monitor:8081/internal/register-ip;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/admin/allowed-ips {
        limit_req  zone=general burst=50 nodelay;
        limit_conn conn 100;
        auth_request /internal/access-check-admin;
        proxy_pass http://market-monitor:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/auth/ {
        limit_req  zone=auth burst=20 nodelay;
        limit_conn conn 100;
        proxy_pass http://market-monitor:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        limit_req  zone=general burst=50 nodelay;
        limit_conn conn 100;
        proxy_pass http://market-monitor:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        limit_req  zone=general burst=50 nodelay;
        limit_conn conn 100;
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
