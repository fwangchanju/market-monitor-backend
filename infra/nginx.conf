server {
    listen 80;
    server_name eolmae.duckdns.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name eolmae.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/eolmae.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eolmae.duckdns.org/privkey.pem;

    location = /internal/access-check-general {
        internal;
        proxy_pass http://market-monitor:8081/internal/access-check/general;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /internal/access-check-admin {
        internal;
        proxy_pass http://market-monitor:8081/internal/access-check/admin;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /internal/register-ip {
        proxy_pass http://market-monitor:8081/internal/register-ip;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/admin/ {
        auth_request /internal/access-check-admin;
        proxy_pass http://market-monitor:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        auth_request /internal/access-check-general;
        proxy_pass http://market-monitor:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin {
        auth_request /internal/access-check-admin;
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location / {
        auth_request /internal/access-check-general;
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
