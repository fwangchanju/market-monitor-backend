spring.application.name=market-monitor

spring.datasource.url=jdbc:postgresql://localhost:5433/market_monitor_db
spring.datasource.username=market_monitor
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

kiwoom.app-key=${KIWOOM_APP_KEY_B}
kiwoom.secret=${KIWOOM_SECRET_B}

auth.google.client-id=${GOOGLE_CLIENT_ID:}
auth.google.client-secret=${GOOGLE_CLIENT_SECRET:}
auth.jwt-secret=${AUTH_JWT_SECRET:}
auth.frontend-url=${AUTH_FRONTEND_URL:http://localhost:5173}

# 텔레그램 캡처를 렌더러에 소유자 인증 토큰과 함께 보낼지 여부. 소유자 데이터 이관 전에는 false로
# 두어 예전과 동일하게(토큰 없이) 동작한다. 이관 완료 후에만 true로 켠다.
renderer.owner-capture-enabled=${RENDERER_OWNER_CAPTURE_ENABLED:false}

krx.login-id=${KRX_ID}
krx.login-pw=${KRX_PW}
market-monitor.base-url=http://localhost:8081
# 소유자 계정 ID. 텔레그램 캡션 TOP2 랭킹 등 비로그인 컨텍스트의 커스텀 데이터 조회와 렌더러 캡처
# 토큰 발급이 이 계정을 기준으로 한다. 999999는 소유자 데이터 이관 전 임시 소유자다.
market-monitor.owner-user-id=${OWNER_USER_ID:999999}
telegram.bot-token=${TELEGRAM_BOT_TOKEN}
telegram.chat-id=${TELEGRAM_CHAT_ID}
telegram.developer-chat-id=${DEVELOPER_CHAT_ID}
telegram.send-minute=10
telegram.send-interval-minutes=15
telegram.before-minutes=15
telegram.average-mode=SIMPLE
telegram.sector-filter=true
telegram.map-send-times=08:15,09:15,15:30

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:flyway
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

krx.enabled=false

# ── 스케줄(cron 표현식에서 ${...}로 참조. collect.start-hour/end-hour는 CollectionScheduler가
# @Value로도 읽는다) ──
collect.start-hour=8
collect.end-hour=20
collect.interval-minutes=5

server.port=8081
server.forward-headers-strategy=framework

# @Scheduled 기본 풀이 1스레드라 하나가 막히면 나머지 스케줄 작업까지 전부 멈춘다
spring.task.scheduling.pool.size=3
