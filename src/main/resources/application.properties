spring.application.name=market-monitor

spring.datasource.url=jdbc:postgresql://localhost:5433/market_monitor_db
spring.datasource.username=market_monitor
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

kiwoom.app-key=${KIWOOM_APP_KEY_B}
kiwoom.secret=${KIWOOM_SECRET_B}

access.admin.tokens=${ADMIN_TOKENS}

krx.login-id=${KRX_ID}
krx.login-pw=${KRX_PW}
market-monitor.base-url=http://localhost:8081
telegram.bot-token=${TELEGRAM_BOT_TOKEN}
telegram.chat-id=${TELEGRAM_CHAT_ID}
telegram.developer-chat-id=${DEVELOPER_CHAT_ID}
telegram.send-minute=10

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:flyway
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

krx.enabled=false

# ── 스케줄(cron 표현식에서 ${...}로 직접 참조 — 자바 코드에서는 안 읽음) ──
collect.start-hour=8
collect.end-hour=20
collect.interval-minutes=5

server.port=8081
server.forward-headers-strategy=framework
